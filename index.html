<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>captainpirate — Cybersecurity Expert & Purple Team</title>
    <meta name="description" content="Cybersecurity expert and purple team operator. Student, researcher, and ethical hacker.">
    <meta name="author" content="captainpirate">
    <meta name="theme-color" content="#0a0a0f">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@300;400;500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #0c0c14;
            --text-primary: #e8ffff;
            --text-muted: #7a9aaa;
            --accent: #00ffff;
            --accent-soft: #66ffff;
            --neon-purple: #ff00ff;
            --neon-pink: #ff2d95;
            --neon-yellow: #ffff00;
            --grid-line: rgba(0, 255, 255, 0.12);
            --card-bg: rgba(8, 16, 24, 0.88);
            --glow: rgba(0, 255, 255, 0.35);
            --terminal-bg: #050a12;
            --terminal-green: #00ffcc;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== VIDEO BACKGROUND ===== */
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 0;
            opacity: 0.3;
            pointer-events: none;
        }

        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            background: linear-gradient(135deg,
                rgba(10,10,15,0.94) 0%,
                rgba(10,10,15,0.72) 35%,
                rgba(10,10,15,0.48) 70%,
                rgba(10,10,15,0.22) 100%
            );
            pointer-events: none;
        }

        /* ===== AMBIENT GLOW ===== */
        .ambient-glow {
            position: fixed;
            top: -30%;
            right: -10%;
            width: 60vw;
            height: 80vh;
            background: radial-gradient(ellipse, rgba(0,255,255,0.12) 0%, rgba(255,0,255,0.06) 40%, transparent 70%);
            z-index: 0;
            pointer-events: none;
            animation: pulseGlow 8s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { opacity: 0.5; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.15); }
        }

        .ambient-glow-2 {
            position: fixed;
            bottom: -20%;
            left: -10%;
            width: 50vw;
            height: 60vh;
            background: radial-gradient(ellipse, rgba(255,0,255,0.1) 0%, rgba(0,255,255,0.04) 45%, transparent 70%);
            z-index: 0;
            pointer-events: none;
            animation: pulseGlow2 10s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow2 {
            0% { opacity: 0.3; transform: scale(1); }
            100% { opacity: 0.8; transform: scale(1.2); }
        }

        /* ===== SCAN LINE ===== */
        .scan-line {
            position: fixed;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), var(--neon-purple), var(--accent), transparent);
            z-index: 9999;
            pointer-events: none;
            animation: scanMove 4s linear infinite;
            opacity: 0.45;
            box-shadow: 0 0 15px var(--accent), 0 0 30px rgba(0,255,255,0.3);
        }

        @keyframes scanMove {
            0% { top: 0; opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { top: 100%; opacity: 0; }
        }

        /* ===== VISITOR COUNTER ===== */
        .visitor-counter {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 9998;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem;
            letter-spacing: 0.12em;
            color: var(--text-muted);
            background: rgba(5, 12, 18, 0.85);
            border: 1px solid rgba(0, 255, 255, 0.25);
            padding: 0.6rem 1rem;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            opacity: 0.85;
            transition: opacity 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 0 15px rgba(0,255,255,0.1);
        }

        .visitor-counter:hover {
            opacity: 1;
            box-shadow: 0 0 25px rgba(0,255,255,0.25);
        }

        .visitor-counter .dot {
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 12px #0ff, 0 0 20px #0ff;
            animation: pulse 2s ease-in-out infinite;
        }

        .visitor-counter .count {
            color: var(--accent-soft);
            font-weight: 700;
            text-shadow: 0 0 10px rgba(0,255,255,0.5);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* ===== TERMINAL EASTER EGG ===== */
        .terminal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.88);
            z-index: 99999;
            display: none;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        .terminal-overlay.active {
            display: flex;
        }

        .terminal-window {
            width: 750px;
            max-width: 92vw;
            background: var(--terminal-bg);
            border: 1px solid rgba(0, 255, 255, 0.4);
            border-radius: 8px;
            overflow: hidden;
            box-shadow:
                0 0 40px rgba(0, 255, 255, 0.2),
                0 0 80px rgba(255, 0, 255, 0.1),
                inset 0 0 40px rgba(0, 255, 255, 0.03);
            animation: terminalEnter 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes terminalEnter {
            0% { transform: scale(0.9) translateY(20px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        .terminal-header {
            display: flex;
            align-items: center;
            padding: 0.8rem 1.2rem;
            background: rgba(0, 255, 255, 0.05);
            border-bottom: 1px solid rgba(0, 255, 255, 0.2);
        }

        .terminal-dots {
            display: flex;
            gap: 0.4rem;
        }

        .terminal-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            box-shadow: 0 0 8px currentColor;
        }

        .terminal-dot.red { background: #ff0055; color: #ff0055; }
        .terminal-dot.yellow { background: #ffff00; color: #ffff00; }
        .terminal-dot.green { background: #00ff88; color: #00ff88; }

        .terminal-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: var(--accent-soft);
            margin-left: 1rem;
            letter-spacing: 0.05em;
            text-shadow: 0 0 10px rgba(0,255,255,0.4);
        }

        .terminal-body {
            padding: 2rem;
            font-family: 'JetBrains Mono', monospace;
            min-height: 300px;
        }

        .terminal-line {
            color: var(--terminal-green);
            font-size: 0.75rem;
            line-height: 1.6;
            margin-bottom: 0.2rem;
            opacity: 0;
            animation: typeIn 0.3s ease forwards;
            text-shadow: 0 0 8px rgba(0,255,204,0.3);
        }

        .terminal-line.info {
            color: var(--text-muted);
            text-shadow: none;
        }

        .terminal-line.info span {
            color: var(--accent-soft);
        }

        .terminal-line.purple {
            color: var(--neon-purple);
            text-shadow: 0 0 15px rgba(255,0,255,0.6), 0 0 30px rgba(255,0,255,0.3);
        }

        .terminal-line.divider {
            color: rgba(0, 255, 255, 0.35);
            letter-spacing: 0.1em;
            margin: 0.8rem 0;
            font-size: 0.6rem;
            text-shadow: none;
        }

        @keyframes typeIn {
            0% { opacity: 0; transform: translateY(5px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .terminal-line:nth-child(1) { animation-delay: 0.1s; }
        .terminal-line:nth-child(2) { animation-delay: 0.2s; }
        .terminal-line:nth-child(3) { animation-delay: 0.3s; }
        .terminal-line:nth-child(4) { animation-delay: 0.4s; }
        .terminal-line:nth-child(5) { animation-delay: 0.5s; }
        .terminal-line:nth-child(6) { animation-delay: 0.6s; }
        .terminal-line:nth-child(7) { animation-delay: 0.7s; }
        .terminal-line:nth-child(8) { animation-delay: 0.8s; }
        .terminal-line:nth-child(9) { animation-delay: 0.9s; }
        .terminal-line:nth-child(10) { animation-delay: 1.0s; }
        .terminal-line:nth-child(11) { animation-delay: 1.1s; }
        .terminal-line:nth-child(12) { animation-delay: 1.2s; }
        .terminal-line:nth-child(13) { animation-delay: 1.3s; }
        .terminal-line:nth-child(14) { animation-delay: 1.4s; }
        .terminal-line:nth-child(15) { animation-delay: 1.5s; }
        .terminal-line:nth-child(16) { animation-delay: 1.6s; }
        .terminal-line:nth-child(17) { animation-delay: 1.7s; }
        .terminal-line:nth-child(18) { animation-delay: 1.8s; }
        .terminal-line:nth-child(19) { animation-delay: 1.9s; }

        .terminal-close-hint {
            font-size: 0.55rem;
            color: var(--text-muted);
            text-align: center;
            margin-top: 1.2rem;
            opacity: 0.4;
            letter-spacing: 0.1em;
        }

        /* ===== MUSIC TOGGLE ===== */
        .music-toggle {
            position: fixed;
            bottom: 30px;
            left: 30px;
            z-index: 9998;
            width: 40px;
            height: 40px;
            background: rgba(5, 12, 18, 0.85);
            border: 1px solid rgba(0, 255, 255, 0.25);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: border-color 0.3s ease, background 0.3s ease, box-shadow 0.3s ease, color 0.3s ease;
            font-size: 1.1rem;
            color: var(--text-muted);
            box-shadow: 0 0 12px rgba(0,255,255,0.1);
        }

        .music-toggle:hover {
            border-color: rgba(0, 255, 255, 0.6);
            background: rgba(0, 255, 255, 0.1);
            color: var(--accent-soft);
            box-shadow: 0 0 25px rgba(0,255,255,0.3);
        }

        .music-toggle.playing {
            border-color: rgba(255, 0, 255, 0.5);
            color: var(--neon-purple);
            box-shadow: 0 0 20px rgba(255,0,255,0.35);
        }

        /* ===== CONTENT WRAPPER ===== */
        .content {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== NAV ===== */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 4rem;
            border-bottom: 1px solid var(--grid-line);
            background: rgba(8, 12, 18, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 0 30px rgba(0,255,255,0.05);
        }

        .logo {
            font-family: 'Orbitron', monospace;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 0.1em;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.35);
        }

        .logo span {
            color: var(--accent);
            text-shadow: 0 0 20px #0ff, 0 0 40px #0ff;
        }

        .nav-links {
            display: flex;
            gap: 2.8rem;
            list-style: none;
        }

        .nav-links a {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-muted);
            text-decoration: none;
            letter-spacing: 0.12em;
            transition: color 0.3s ease, text-shadow 0.3s ease;
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--accent);
            box-shadow: 0 0 8px #0ff;
            transition: width 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--accent-soft);
            text-shadow: 0 0 12px rgba(0,255,255,0.5);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .terminal-hint {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.55rem;
            color: var(--text-muted);
            letter-spacing: 0.1em;
            opacity: 0.7;
            border: 1px solid rgba(0,255,255,0.2);
            padding: 0.3rem 0.8rem;
            border-radius: 3px;
            background: rgba(0, 255, 255, 0.04);
            box-shadow: 0 0 10px rgba(0,255,255,0.08);
        }

        .terminal-hint strong {
            color: var(--neon-purple);
            text-shadow: 0 0 10px rgba(255,0,255,0.5);
            opacity: 1;
        }

        /* ===== HERO ===== */
        .hero {
            min-height: 90vh;
            display: flex;
            align-items: center;
            padding: 2rem 4rem 4rem;
            position: relative;
        }

        .hero-content {
            max-width: 750px;
        }

        .hero-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: var(--accent-soft);
            letter-spacing: 0.25em;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            opacity: 0.9;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
        }

        .hero h1 {
            font-family: 'Orbitron', monospace;
            font-size: clamp(3rem, 7vw, 5.5rem);
            font-weight: 900;
            line-height: 0.92;
            letter-spacing: -0.03em;
            margin-bottom: 1.5rem;
            text-shadow: 0 0 30px rgba(0,255,255,0.15);
        }

        .hero h1 .highlight {
            color: var(--accent);
            text-shadow:
                0 0 20px #0ff,
                0 0 50px rgba(0, 255, 255, 0.45),
                0 0 100px rgba(255, 0, 255, 0.2);
        }

        .hero p {
            font-size: 1rem;
            line-height: 1.9;
            color: var(--text-muted);
            max-width: 540px;
            margin-bottom: 2.5rem;
        }

        .hero p strong {
            color: var(--accent-soft);
            text-shadow: 0 0 10px rgba(0,255,255,0.3);
        }

        .hero-buttons {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .btn {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem;
            padding: 0.95rem 2.2rem;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.7rem;
            letter-spacing: 0.03em;
        }

        .btn-primary {
            background: rgba(0, 255, 255, 0.08);
            color: var(--text-primary);
            border: 1px solid rgba(0, 255, 255, 0.55);
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.18), inset 0 0 20px rgba(0, 255, 255, 0.04);
        }

        .btn-primary:hover {
            background: rgba(0, 255, 255, 0.18);
            box-shadow: 0 0 45px rgba(0, 255, 255, 0.35), 0 0 80px rgba(255, 0, 255, 0.1);
            transform: translateY(-2px);
            border-color: #0ff;
            color: #fff;
            text-shadow: 0 0 10px #0ff;
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid rgba(255, 0, 255, 0.35);
            box-shadow: 0 0 15px rgba(255,0,255,0.08);
        }

        .btn-secondary:hover {
            border-color: rgba(255, 0, 255, 0.7);
            background: rgba(255, 0, 255, 0.08);
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(255,0,255,0.25);
            text-shadow: 0 0 10px rgba(255,0,255,0.5);
        }

        .hero-status {
            display: flex;
            gap: 2.5rem;
            margin-top: 3rem;
            opacity: 0.85;
        }

        .hero-status-item {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.55rem;
            letter-spacing: 0.12em;
            color: var(--text-muted);
        }

        .hero-status-item span {
            display: block;
            font-size: 0.7rem;
            color: var(--accent-soft);
            margin-top: 0.3rem;
            letter-spacing: 0.08em;
            text-shadow: 0 0 10px rgba(0,255,255,0.3);
        }

        /* ===== SECTIONS GENERAL ===== */
        section {
            padding: 5.5rem 4rem;
            border-top: 1px solid var(--grid-line);
        }

        .section-header {
            display: flex;
            align-items: flex-end;
            gap: 1.5rem;
            margin-bottom: 3.5rem;
        }

        .section-number {
            font-family: 'Orbitron', monospace;
            font-size: 0.6rem;
            color: var(--accent);
            letter-spacing: 0.2em;
            opacity: 0.8;
            text-shadow: 0 0 12px rgba(0,255,255,0.4);
        }

        .section-title {
            font-family: 'Orbitron', monMonitor;
            font-size: clamp(1.8rem, 3.5vw, 2.8rem);
            font-weight: 700;
            color: var(--text-primary);
            text-shadow: 0 0 25px rgba(0, 255, 255, 0.25);
        }

        .section-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, rgba(0,255,255,0.4), rgba(255,0,255,0.2), transparent);
            margin-bottom: 0.4rem;
            box-shadow: 0 0 8px rgba(0,255,255,0.2);
        }

        /* ===== ABOUT ===== */
        .about-grid {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 3.5rem;
            align-items: start;
        }

        .about-text p {
            color: var(--text-muted);
            line-height: 1.95;
            margin-bottom: 1.2rem;
            font-size: 0.95rem;
        }

        .about-text strong {
            color: var(--accent-soft);
            text-shadow: 0 0 8px rgba(0,255,255,0.25);
        }

        .about-text .student-badge {
            display: inline-block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem;
            color: var(--accent);
            border: 1px solid rgba(0, 255, 255, 0.4);
            padding: 0.2rem 0.8rem;
            letter-spacing: 0.1em;
            margin-bottom: 0.8rem;
            background: rgba(0, 255, 255, 0.06);
            box-shadow: 0 0 15px rgba(0,255,255,0.12);
            text-shadow: 0 0 10px rgba(0,255,255,0.4);
        }

        .about-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--grid-line);
            padding: 2rem 1.8rem;
            text-align: center;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 4px;
            transition: border-color 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
        }

        .stat-card:hover {
            border-color: rgba(0, 255, 255, 0.5);
            transform: translateY(-3px);
            box-shadow: 0 8px 35px rgba(0, 255, 255, 0.15), 0 0 40px rgba(255,0,255,0.06);
        }

        .stat-card .number {
            font-family: 'Orbitron', monospace;
            font-size: 2.8rem;
            font-weight: 700;
            color: var(--accent);
            text-shadow: 0 0 25px rgba(0, 255, 255, 0.5), 0 0 50px rgba(0,255,255,0.2);
        }

        .stat-card .label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.58rem;
            color: var(--text-muted);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-top: 0.6rem;
            display: block;
        }

        /* ===== CAPABILITIES ===== */
        .caps-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
        }

        .cap-card {
            background: var(--card-bg);
            border: 1px solid var(--grid-line);
            padding: 2.2rem;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 4px;
            transition: border-color 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
        }

        .cap-card:hover {
            border-color: rgba(255, 0, 255, 0.4);
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 255, 255, 0.1), 0 0 50px rgba(255,0,255,0.08);
        }

        .cap-card .cap-number {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem;
            color: var(--accent);
            opacity: 0.7;
            margin-bottom: 1rem;
            display: block;
            letter-spacing: 0.1em;
            text-shadow: 0 0 10px rgba(0,255,255,0.4);
        }

        .cap-card h3 {
            font-family: 'Orbitron', monospace;
            font-size: 1.15rem;
            margin-bottom: 0.8rem;
            color: var(--text-primary);
            text-shadow: 0 0 15px rgba(0,255,255,0.15);
        }

        .cap-card p {
            font-size: 0.82rem;
            color: var(--text-muted);
            line-height: 1.75;
            margin-bottom: 1rem;
        }

        .cap-card ul {
            list-style: none;
            margin-top: 0.5rem;
        }

        .cap-card ul li {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: var(--text-muted);
            padding: 0.55rem 0;
            border-bottom: 1px solid rgba(0,255,255,0.06);
            display: flex;
            align-items: center;
            gap: 0.7rem;
        }

        .cap-card ul li:last-child {
            border-bottom: none;
        }

        .cap-card ul li::before {
            content: "";
